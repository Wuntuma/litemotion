[package]
name = "litemotion-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "litemotion"
path = "src/main.rs"

[dependencies]
litemotion-engine = { path = "../engine" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
egui = { version = "0.29", default-features = false }
litemotion-audio = { path = "../audio" }
