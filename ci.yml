name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No sound card on CI runners: use miniaudio's silent real-time backend.
  LITEMOTION_AUDIO_BACKEND: "null"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The tests drive a real FFmpeg (libx264 + aac are required).
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: FFmpeg sanity check
        run: |
          ffmpeg -version | head -1
          ffmpeg -hide_banner -encoders | grep -E " (libx264|aac) "

      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked -- --nocapture

  licenses:
    name: licence report is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/license_report.py
      - name: Fail if the committed report is stale
        run: git diff --exit-code docs/THIRD_PARTY_LICENSES.md
