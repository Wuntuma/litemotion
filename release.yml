name: Release build

# Builds the app for each desktop platform and uploads zips/tarballs.
# Push a tag like v0.1.0 to also create a DRAFT GitHub release (review it, then publish).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: windows-x86_64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,      name: macos-apple-silicon }
          - { os: macos-latest,   target: x86_64-apple-darwin,       name: macos-intel }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p litemotion-app -p litemotion-cli

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          DIR="litemotion-${VER}-${{ matrix.name }}"
          EXT=""; if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          mkdir -p "$DIR/bin" dist
          cp "target/${{ matrix.target }}/release/litemotion${EXT}" "$DIR/"
          cp "target/${{ matrix.target }}/release/litemotion-cli${EXT}" "$DIR/"
          cp README.md "$DIR/"
          cp -r docs "$DIR/docs"
          cp -r samples "$DIR/samples"
          cat > "$DIR/bin/PUT-FFMPEG-HERE.txt" <<'TXT'
          LiteMotion needs FFmpeg and ffprobe. Either install them so they are on your PATH,
          or copy ffmpeg and ffprobe into this folder (next to this file).
          See docs/BUILDING.md and docs/THIRD_PARTY_LICENSES.md (FFmpeg licensing).
          TXT
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/$DIR.zip" "$DIR"
          else
            tar -czf "dist/$DIR.tar.gz" "$DIR"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: litemotion-${{ matrix.name }}
          path: dist/*

  draft-release:
    name: draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --draft --generate-notes --title "LiteMotion ${{ github.ref_name }}"
